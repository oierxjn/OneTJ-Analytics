stages:
  - test
  - deploy

default:
  image: python:3.12
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  INGEST_BACKEND: "memory"
  DEPLOY_PORT: "22"
  DEPLOY_PATH: "/opt/OneTJ-Analytics"

test:
  stage: test
  script:
    - python -m venv .venv
    - . .venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pytest -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

deploy:
  stage: deploy
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git openssh-client
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - |
      ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
      set -e
      cd \"$DEPLOY_PATH\"
      git fetch --all
      git checkout \"$CI_COMMIT_SHA\"
      if [ ! -d .venv ]; then python3 -m venv .venv; fi
      .venv/bin/python -m pip install --upgrade pip
      .venv/bin/python -m pip install -r requirements-dev.txt
      sudo systemctl restart onetj-analytics
      sudo systemctl restart onetj-analytics-worker
      sudo systemctl --no-pager --full status onetj-analytics onetj-analytics-worker
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
    - when: never
